[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp-drawing-api"
version = "1.0.0"
description = "Engineering Signal Plan - Railway DXF Generator"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.1",
    "pyproj>=3.6",
    "shapely>=2.0",
    "numpy>=1.24",
    "pydantic>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
